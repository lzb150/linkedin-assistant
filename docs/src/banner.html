<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linkedin-assistant banner</title>
<!-- Source of docs/banner.png and docs/banner.uk.png (?lang=uk). Rendered by render.mjs.
     A dark HUD bar in both colour schemes, like the dashboard header. -->
<link rel="stylesheet" href="night-city.css">
<style>
  :root { color-scheme: dark; }
  body { background: transparent; }
  .banner {
    position: relative; width: 960px; height: 240px; overflow: hidden; --city-base: var(--hud-bg); --accent: var(--cyan); --hot: var(--magenta);
    border: 1px solid var(--hud-border); display: grid; grid-template-columns: 1fr 176px; align-items: center; gap: 24px;
    padding: 0 40px 0 44px; --band: var(--cyan);
  }
  .banner::before, .banner::after { z-index: 6; }
  .banner .rail {
    position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; z-index: 6;
    background: linear-gradient(90deg, var(--cyan), var(--magenta) 55%, transparent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--magenta) 60%, transparent);
  }
  .eyebrow { font: 600 13px/1 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); }
  .eyebrow b { color: var(--yellow); font-weight: 600; }
  h1 {
    margin: 14px 0 0; font: 700 54px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--hud-text);
    white-space: nowrap;
  }
  h1 span { color: var(--magenta); }
  .tag { margin: 14px 0 0; font: 400 19px/1.3 "Exo 2", sans-serif; color: var(--hud-muted); }
  .tag b { font-weight: 600; color: var(--hud-text); }
  .chips { display: flex; gap: 10px; margin-top: 20px; }
  .chip {
    --c: var(--cyan); padding: 7px 12px 7px 11px; font: 600 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent);
    text-shadow: 0 0 8px var(--c);
  }
  .chip.green { --c: #05ffa1; } .chip.hot { --c: var(--magenta); }
  .icon { color-scheme: light; width: 176px; height: 176px; display: block; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--cyan) 35%, transparent)); }
</style>
</head>
<body>
<div class="banner city hud">
  <i class="scan"></i>
  <div>
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 class="split">LinkedIn<span>-</span>Assistant</h1>
    <p class="tag" data-t="tag"></p>
    <div class="chips">
      <span class="chip" data-t="c1"></span><span class="chip green" data-t="c2"></span><span class="chip hot" data-t="c3"></span>
    </div>
  </div>
  <object class="icon" data="../../jobs-icon.svg" type="image/svg+xml" aria-hidden="true"></object>
  <i class="rail"></i>
</div>
<script>
  const T = {
    en: { eyebrow: "<b>//</b> local job radar · dou · djinni · linkedin", tag: "Finds, scores, drafts. <b>The last click is yours.</b>", c1: "3 sources", c2: "100% local", c3: "never sends" },
    uk: { eyebrow: "<b>//</b> локальний радар вакансій · dou · djinni · linkedin", tag: "Шукає, оцінює, готує чернетки. <b>Останній клік — ваш.</b>", c1: "3 джерела", c2: "лише локально", c3: "нічого не надсилає" },
  };
  const lang = new URLSearchParams(location.search).get("lang") === "uk" ? "uk" : "en";
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = T[lang][el.dataset.t];
</script>
</body>
</html>
