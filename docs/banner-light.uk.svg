<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="linkedin-assistant: локальний радар вакансій — шукає, оцінює й готує чернетки, але нічого не надсилає">
  <rect width="960" height="200" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="86" font-size="44" font-weight="700" fill="#1f2328">linkedin<tspan fill="#0969da">-</tspan>assistant</text>
    <text x="48" y="122" font-size="18" fill="#57606a">Локальний радар вакансій — шукає, оцінює, готує чернетки. Останній клік — ваш.</text>
    <g font-size="13" font-weight="600">
      <rect x="48" y="146" width="104" height="26" rx="13" fill="#ddf4ff" stroke="#0969da"/>
      <text x="100" y="164" text-anchor="middle" fill="#0969da">3 джерела</text>
      <rect x="162" y="146" width="122" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37"/>
      <text x="223" y="164" text-anchor="middle" fill="#1a7f37">лише локально</text>
      <rect x="294" y="146" width="160" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/>
      <text x="374" y="164" text-anchor="middle" fill="#57606a">нічого не надсилає</text>
    </g>
  </g>
  <g transform="translate(792 40)" fill="none" stroke="#0969da" stroke-width="3">
    <rect width="120" height="120" rx="16" stroke="#d0d7de" fill="#ffffff"/>
    <circle cx="60" cy="60" r="40"/>
    <circle cx="60" cy="60" r="24"/>
    <circle cx="60" cy="60" r="9" fill="#0969da"/>
  </g>
</svg>
