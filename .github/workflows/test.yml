name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Tests never launch a browser — plain npm ci, no playwright install.
      - run: npm ci
      - run: node --test test/
      - name: Syntax-check every module
        shell: bash
        run: |
          set -e
          for f in *.mjs lib/*.mjs lib/sources/*.mjs; do node --check "$f"; done
      - name: Dashboard smoke build
        shell: bash
        run: |
          set -e
          mkdir -p applications
          node dashboard.mjs
          grep -q "statusOfEntry" applications/index.html
      - name: Lint shell scripts
        shell: bash
        run: bash -n *.sh *.sh.example
      - name: Lint Swift app and launchd templates (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          xcrun swiftc -parse jobs-app.swift
          plutil -lint *.plist.example
