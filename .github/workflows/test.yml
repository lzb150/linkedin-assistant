name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Tests never launch a browser — plain npm ci, no playwright install.
      - run: npm ci
      - run: node --test test/
      - name: Syntax-check every module
        shell: bash
        run: |
          set -e
          # Every tracked JS module outside test/, found by git rather than by a
          # hand-kept glob list: `lib/*.mjs lib/sources/*.mjs` silently skipped
          # any new subdirectory, so a module added one level deeper would have
          # escaped node --check AND both Playwright guards while staying green.
          FILES=$(git ls-files '*.mjs' '*.js' '*.cjs' | grep -v '^test/')   # one list: the guards below must never drift apart
          for f in $FILES; do node --check "$f"; done
          # Playwright: page.$()/el.$() return ONE handle — iterating/slicing it is a
          # silent TypeError behind catch {} (bit us twice). Convention: a single
          # handle is either consumed via .then(Boolean) or bound to a *El name.
          # NOTE: `! cmd` is exempt from `set -e`, so each guard fails the step explicitly.
          if grep -nE 'await [a-zA-Z_.]+\.\$\(' $FILES | grep -vE '[eE]l = await|\.then\(Boolean\)'; then
            echo "::error::single-handle page.\$() result used as a list (see above)"; exit 1; fi
          # …and never iterate/slice a single handle even when it IS bound to a *El name.
          if grep -nE 'of await [a-zA-Z_.]+\.\$\(|\.\$\([^)]*\)\.(slice|length|map|forEach)|of [a-zA-Z_]+El\b' $FILES; then
            echo "::error::single-handle iterated/sliced (see above)"; exit 1; fi
      - name: Dashboard smoke build
        shell: bash
        run: |
          set -e
          # Hostile package: every scraped field must be escaped, urls http(s)-only.
          mkdir -p applications
          cp test/fixtures/hostile-package.md applications/
          node dashboard.mjs
          grep -q "advanceLastVisit" applications/index.html
          grep -q '&lt;img src=x onerror=' applications/index.html   # fixture rendered AND escaped (guards below are negative-only)
          if grep -q '<img src=x onerror=' applications/index.html; then echo "::error::unescaped markup in dashboard"; exit 1; fi   # escaped form is &lt;img …
          # Quote-agnostic and case-insensitive: the old pattern matched only
          # href="javascript: , so a regression emitting single quotes or
          # "JavaScript:" would have passed green.
          if grep -qiE 'href=["'"'"']?[[:space:]]*javascript:' applications/index.html; then echo "::error::javascript: href in dashboard"; exit 1; fi
      - name: Lint shell scripts
        shell: bash
        run: bash -n *.sh *.sh.example
      # Pinned to the commit behind 2.0.0: a tag is mutable, and this action
      # runs with the repository checked out.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          ignore_paths: node_modules
          additional_files: run.sh.example   # .example is not a shell extension; name it explicitly
      - name: Lint Swift app and launchd templates (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          xcrun swiftc -typecheck jobs-app.swift
          # …and actually link it, with the same -target build-jobs.sh uses. A
          # typecheck alone never proved the app still builds, so a link break
          # (a missing framework, a bad -target) would have shipped green.
          xcrun swiftc -O -framework Cocoa -target "$(uname -m)-apple-macos13.0" -o "$RUNNER_TEMP/jobs" jobs-app.swift
          plutil -lint *.plist.example
