name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 20 = the engines floor; 24 = what the owner's Mac runs. Only 20 was
        # tested while `node --test test/` broke on 22+ (a positional arg became
        # a glob, the directory a missing module) — green CI, red `npm test`.
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    # The suite takes under a minute; a hung test must not burn the 6 h default
    # of macOS runner minutes.
    timeout-minutes: 15
    steps:
      # Pinned to commits like the shellcheck action below: a tag is mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Tests never launch a browser — plain npm ci, no playwright install.
      - run: npm ci
      # Bare: every Node from 20 up finds test/ by its own default, a path does not.
      - run: node --test
      # oxlint, not ESLint: one package and its prebuilt binary, in a repo with
      # one runtime dependency. Only the `correctness` category is on — the rules
      # that catch bugs. The style categories wanted 65 changes to working code on
      # day one, which is how a linter gets ignored.
      - run: npm run lint
      - name: Filenames must be plain
        shell: bash
        run: |
          # A broken shell command once left a file named after its own source
          # text, and `git add -A` committed it. Anything outside this set is
          # debris, not a deliberate name.
          if git ls-files | grep -vE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::tracked file with a non-plain name (see above)"; exit 1; fi
      - name: Syntax-check every module
        shell: bash
        run: |
          set -e
          # Every tracked JS module outside test/, found by git rather than by a
          # hand-kept glob list: `lib/*.mjs lib/sources/*.mjs` silently skipped
          # any new subdirectory, so a module added one level deeper would have
          # escaped node --check AND both Playwright guards while staying green.
          FILES=$(git ls-files '*.mjs' '*.js' '*.cjs' | grep -v '^test/')   # one list: the guards below must never drift apart
          for f in $FILES; do node --check "$f"; done
          # Playwright: page.$()/el.$() return ONE handle — iterating/slicing it is a
          # silent TypeError behind catch {} (bit us twice). Convention: a single
          # handle is either consumed via .then(Boolean) or bound to a *El name.
          # NOTE: `! cmd` is exempt from `set -e`, so each guard fails the step explicitly.
          if grep -nE 'await [a-zA-Z_.]+\.\$\(' $FILES | grep -vE '[eE]l = await|\.then\(Boolean\)'; then
            echo "::error::single-handle page.\$() result used as a list (see above)"; exit 1; fi
          # …and never iterate/slice a single handle even when it IS bound to a *El name.
          if grep -nE 'of await [a-zA-Z_.]+\.\$\(|\.\$\([^)]*\)\.(slice|length|map|forEach)|of [a-zA-Z_]+El\b' $FILES; then
            echo "::error::single-handle iterated/sliced (see above)"; exit 1; fi
      - name: Dashboard smoke build
        shell: bash
        run: |
          set -e
          # Hostile package: every scraped field must be escaped, urls http(s)-only.
          mkdir -p applications
          cp test/fixtures/hostile-package.md applications/
          node dashboard.mjs
          grep -q "advanceLastVisit" applications/index.html
          grep -q '&lt;img src=x onerror=' applications/index.html   # fixture rendered AND escaped (guards below are negative-only)
          if grep -q '<img src=x onerror=' applications/index.html; then echo "::error::unescaped markup in dashboard"; exit 1; fi   # escaped form is &lt;img …
          # Quote-agnostic and case-insensitive: the old pattern matched only
          # href="javascript: , so a regression emitting single quotes or
          # "JavaScript:" would have passed green.
          if grep -qiE 'href=["'"'"']?[[:space:]]*javascript:' applications/index.html; then echo "::error::javascript: href in dashboard"; exit 1; fi
      - name: Lint shell scripts
        shell: bash
        run: bash -n *.sh *.sh.example
      # Pinned to the commit behind 2.0.0: a tag is mutable, and this action
      # runs with the repository checked out.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          ignore_paths: node_modules
          additional_files: run.sh.example   # .example is not a shell extension; name it explicitly
      - name: Lint Swift app and launchd templates (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          xcrun swiftc -typecheck jobs-app.swift
          # …and actually link it, with the same -target build-jobs.sh uses. A
          # typecheck alone never proved the app still builds, so a link break
          # (a missing framework, a bad -target) would have shipped green.
          xcrun swiftc -O -framework Cocoa -target "$(uname -m)-apple-macos13.0" -o "$RUNNER_TEMP/jobs" jobs-app.swift
          plutil -lint *.plist.example

  # The dashboard in a real browser (npm run test:e2e, e2e/). Its own job: the
  # unit job above never installs a browser, and macOS minutes would buy
  # nothing here — the page is the same HTML on every OS. Node 20 + 24 because
  # each test runs its own state server on the runner's Node.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    # The suite takes ~10 s; the rest is npm ci and the Chromium download.
    # 15, not 10: the install step below may take three bounded attempts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The Chromium build pinned in package-lock.json, cached across runs: the
      # download hung four times on 2026-10-22 alone, each time until the job
      # timeout cancelled it. On a cache hit `playwright install` has nothing
      # to fetch and only the apt step (--with-deps) runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Bounded and retried: a hung download fails the attempt after 3 minutes
      # and is tried again, instead of sitting until the job timeout and
      # needing a manual rerun. Only the download is under the loop — a kill
      # mid apt-get would leave dpkg interrupted and sink the next attempts on
      # the same lock, so the system packages are installed once, after it.
      - run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::playwright download attempt $attempt failed or hung — retrying"
          done
          exit 1
      - run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # Report and traces (trace: retain-on-failure) for a red run.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
